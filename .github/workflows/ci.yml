name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    env:
      # a test still running after 200 s gets its native stacks dumped by py-spy, and the process is killed at 420 s
      # (tests/hang_watchdog.py): a hang inside Qt that holds the GIL is out of pytest-timeout's reach (FIX-3)
      QB_HANG_WATCHDOG: "1"
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon (PLAT-2). GitHub no longer runs macos-14 jobs (cancelled at once: "The
        # configuration 'macos-14-arm64-us-default' is not supported")
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    # macOS is being brought up (docs/PLATFORMS.md): report, don't block, until it is green
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    # A modal dialog or a hung render would otherwise hold the runner for the 6 h default
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        # Qt 6's xcb platform plugin aborts the process (in QApplication()) when one of these is missing
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 \
            libxcb-xkb1
      - name: OpenGL for Qt and VTK (Windows)
        # GitHub's Windows runners have no GPU and only GDI's OpenGL 1.1; VTK 9 needs 3.2+. This installs
        # Mesa's llvmpipe opengl32.dll system-wide (not the off-screen-only build: the viewer embeds an
        # on-screen QtInteractor) and leaves PYVISTA_OFF_SCREEN unset for the same reason.
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@v4
        with:
          pyvista: false
          install-mesa3d-offscreen: false
      - name: Install (core, CPU only; GPU engines are optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # the hang watchdog's native stacks (tests/hang_watchdog.py, FIX-3)
          pip install py-spy
      - name: Lint
        run: ruff check .
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        # thread method: a test stuck inside Qt's event loop (where the signal method never fires: the hang of
        # 2026-11-13) is killed after 300 s with every thread's stack, instead of running into the 30 min job limit
        run: xvfb-run -a pytest -q --timeout=300 --timeout-method=thread
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pytest -q --timeout=300
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pytest -q --timeout=300
