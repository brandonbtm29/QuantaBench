name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]   # macos-14 = Apple Silicon (PLAT-2)
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    # macOS is being brought up (docs/PLATFORMS.md): report, don't block, until it is green
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    # A modal dialog or a hung render would otherwise hold the runner for the 6 h default
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        # Qt 6's xcb platform plugin aborts the process (in QApplication()) when one of these is missing
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 \
            libxcb-xkb1
      - name: OpenGL for Qt and VTK (Windows)
        # GitHub's Windows runners have no GPU and only GDI's OpenGL 1.1; VTK 9 needs 3.2+. This installs
        # Mesa's llvmpipe opengl32.dll system-wide (not the off-screen-only build: the viewer embeds an
        # on-screen QtInteractor) and leaves PYVISTA_OFF_SCREEN unset for the same reason.
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@v4
        with:
          pyvista: false
          install-mesa3d-offscreen: false
      - name: Install (core, CPU only; GPU engines are optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q --timeout=300
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pytest -q --timeout=300
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: pytest -q --timeout=300
