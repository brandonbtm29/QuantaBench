[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "quantabench"
dynamic = ["version"]
description = "An open, GPU-aware molecular modeling workbench: build geometries, search conformers, optimize with ML potentials and xTB, and visualize the results."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Brandon T. McReynolds" }]
keywords = [
    "computational-chemistry", "molecular-modeling", "conformer-search", "geometry-optimization",
    "machine-learning-potentials", "xtb", "rdkit", "ase", "pyside6", "pfas",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rdkit>=2024.3",
    "ase>=3.23",
    "psutil>=5.9",
    "platformdirs>=4.2",
    "PySide6-Essentials>=6.8",
    "pyvista>=0.44",
    "pyvistaqt>=0.11,<0.13",  # 0.13 (FBO QOpenGLWidget) crashes in initializeGL on AMD/Windows; 0.12 uses a native window
    "pyqtgraph>=0.13.7",      # spectra and plots (pure Python)
]

[project.optional-dependencies]
# PyTorch is NOT listed here on purpose: install the build that matches your GPU first
# (AMD ROCm on Windows/Linux, NVIDIA CUDA, or CPU). See docs/INSTALL.md.
ml = ["aimnet>=0.2"]                       # AIMNet2 neutral + charged organics (needs torch)
xtb = ["dxtb>=0.4",                        # GFN1-xTB in PyTorch (GFN2 also needs tad-libcint, Linux)
       # tblite: in-process GFN2-xTB. PyPI has wheels for Linux and macOS only; on Windows pip would try to
       # compile PyPI's sdist (needs gfortran) and fail, hence the marker. Windows wheels come from the
       # brandonbtm29/tblite fork's GitHub release, installed with a separate pip line (docs/INSTALL.md):
       # a direct URL or --find-links cannot go into the metadata of a package published on PyPI.
       "tblite>=0.4; sys_platform != 'win32'"]
interop = ["cclib>=1.8"]                   # import Gaussian/ORCA/Psi4/xtb/MOPAC/... output files
protonate = ["dimorphite-dl>=2.0"]         # pH-dependent protonation states
ovito = ["ovito>=3.12"]                    # embedded OVITO viewport for big systems / trajectories
md = ["lammps>=2023.8"]                    # LAMMPS Python module (CPU + OpenMP) for `md smd --run` and checks
excel = ["openpyxl>=3.1"]                  # .xlsx/.xlsm input (CompTox dashboard exports)
# lammps ships wheels for Windows (win_amd64), Linux and macOS; openpyxl is pure Python
all = ["quantabench[ml,xtb,protonate,md,excel,interop]"]
# External programs (xtb, CREST, MOPAC, Psi4) are not pip packages: see environment.yml and docs/ENGINES.md
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/brandonbtm29/QuantaBench"
Issues = "https://github.com/brandonbtm29/QuantaBench/issues"
Changelog = "https://github.com/brandonbtm29/QuantaBench/blob/main/CHANGELOG.md"

[project.scripts]
quantabench-cli = "quantabench.cli:main"

[project.gui-scripts]
quantabench = "quantabench.gui.app:main"

[tool.hatch.version]
path = "src/quantabench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quantabench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "external: needs an external program (xtb, CREST, MOPAC, Psi4); skipped when it is not installed",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "E501",  # long lines: wrap them when touching that code
    "S310",  # urllib on fixed https URLs (PubChem lookup)
    "B905",  # zip() without strict=: lengths are checked where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
# running external chemistry programs (xtb, CREST, MOPAC, Psi4) is what these modules are for
"src/quantabench/chem/external.py" = ["S603", "S607", "S110"]
"src/quantabench/chem/eng_*.py" = ["S603", "S607"]
"src/quantabench/chem/crest.py" = ["S603", "S607"]
"src/quantabench/chem/qm.py" = ["S603", "S607"]
